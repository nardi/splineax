[project]
name = "splineax"
version = "0.3.0"
description = "Sparse linear operators and solvers for Lineax"
readme = "README.md"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
requires-python = ">=3.11"
dependencies = [
    "lineax>=0.1.1",
    "jax>=0.4",
    "equinox>=0.11",
    "jaxtyping>=0.2",
    "splineax-klujax>=0.5.0.post5",
    "asdex>=0.5.1",
]

[project.optional-dependencies]
pardiso = ["pardiso-mkl-jax>=0.2.2"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# `splineax-klujax` and `pardiso-mkl-jax` are pinned to their `ordered_tokens` branches,
# which return an ordering token from every read so a later in-place refactor waits on the
# solve. `linear_solve` relies on that token to keep a reused factorization ordered under
# `jit`. See `docs/dev/klujax-ordered-state-tokens.md`.
[tool.uv.sources]
splineax-klujax = { git = "https://github.com/nardi/klujax", branch = "ordered_tokens" }
pardiso-mkl-jax = { git = "https://github.com/nardi/pardiso-mkl-jax", branch = "ordered_tokens" }

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.27",
    "pytest>=9.1.0",
    "pytest-markdown-docs>=0.9.2",
    "ruff>=0.15.17",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
# Execute the code examples in the markdown docs (and README) as tests via
# pytest-markdown-docs. The superfences syntax lets dependent code blocks share state
# with a `{.python continuation}` fence, which also renders under Material for MkDocs.
addopts = "--markdown-docs --markdown-docs-syntax superfences"
testpaths = ["tests", "docs", "README.md"]

[tool.ruff.lint]
ignore = ["F722"]
select = ["E4", "E7", "E9", "F", "I"]
