name: Benchmarks

# Manual only. A full run takes tens of minutes, and shared runners give unstable absolute
# timings, so this is a tool for inspecting scaling shape rather than a gate on every push.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Matrix sizes, comma separated (blank for the default six)"
        required: false
        type: string
      families:
        description: "Families: band, grid2d, graph, random (blank for all)"
        required: false
        type: string
      solvers:
        description: "Solvers: spsolve, klu, pardiso (blank for all)"
        required: false
        type: string
      batching:
        description: "Batching strategy for multiple right-hand sides"
        required: false
        default: vmap
        type: choice
        options: [vmap, lax_map]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        # --extra pardiso so Pardiso is measured instead of skipped, --group bench for
        # pytest-benchmark, matplotlib, scipy and environs.
        run: uv sync --locked --extra pardiso --group bench

      - name: Run benchmarks
        # These flags are also the documented default in benchmarks/README.md, so local and
        # CI runs stay comparable. Rounds remain autocalibrated: --benchmark-min-rounds only
        # lowers the floor from 5.
        env:
          SPLINEAX_BENCH_SIZES: ${{ inputs.sizes }}
          SPLINEAX_BENCH_FAMILIES: ${{ inputs.families }}
          SPLINEAX_BENCH_SOLVERS: ${{ inputs.solvers }}
          SPLINEAX_BENCH_BATCHING: ${{ inputs.batching }}
        run: |
          uv run pytest benchmarks \
            --benchmark-json=benchmarks/results/bench.json \
            --benchmark-warmup=on --benchmark-min-rounds=3 --benchmark-disable-gc \
            --benchmark-sort=name \
            --benchmark-columns=min,median,mean,stddev,rounds

      - name: Plot results
        run: uv run python benchmarks/plot_results.py benchmarks/results/bench.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
